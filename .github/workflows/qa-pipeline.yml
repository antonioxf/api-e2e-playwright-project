name: QA Pipeline (E2E & API)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'features/**'
      - 'pages/**'
      - 'support/**'
      - 'step-definitions/**'
      - 'package.json'
      - 'playwright.config.js'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  run-qa-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências do Projeto
        run: npm ci

      - name: Instalar Navegadores e Dependências do Playwright
        run: npx playwright install --with-deps

      # 1. Executa os Testes de API (Sobe o Express na porta 3000, testa e encerra)
      - name: Executar Testes Automatizados de API
        run: npm run test:api
        continue-on-error: true

      # 2. Executa os Testes E2E de Interface
      - name: Executar Testes Automatizados E2E (Cucumber)
        run: npm run test:e2e
        continue-on-error: true

      # 3. Salva todos os relatórios e evidências (E2E e API) nos Artifacts
      - name: Salvar Relatórios e Evidências (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-test-reports-and-evidences
          path: |
            reports/
            target/
            test-results/
          retention-days: 7